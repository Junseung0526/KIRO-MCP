server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS so 'backend' is resolved at request time
    # (avoids nginx failing to start if backend isn't up yet).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse-proxy API + health to the backend over the internal compose network.
    # This lets the whole app be served from a single origin/port (no CORS needed).
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat calls Kiro CLI on the host which can take a while; allow long reads.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Disable buffering so future SSE streaming works through the proxy.
        proxy_buffering off;
    }

    location = /health {
        set $backend_health http://backend:3000;
        proxy_pass $backend_health/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback for the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
